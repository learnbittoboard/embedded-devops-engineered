#
# MCUboot's own configuration for this course — the size-slim
# bootloader build Nordic ships for this exact devicetree FOTA
# layout (modelled on the Zigbee add-on's light_switch FOTA
# sysbuild files, read from the add-on sources):
#
# no console, no logging, no printk — a bootloader that says
# nothing and fits the 64 KB boot partition the layout grants
# it. Signing stays at the sysbuild default (the MCUboot
# development key): fine for a lab, and Chapter 9's lesson is
# explicit that a product generates and guards its own key.
#

CONFIG_MAIN_STACK_SIZE=10240

CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
CONFIG_BOOT_BOOTSTRAP=n
CONFIG_PM=n

CONFIG_FLASH=y
CONFIG_FPROTECT=y

# Bootloader size optimization
CONFIG_CBPRINTF_NANO=y
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_GPIO=n

CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=y

CONFIG_LOG=n
CONFIG_CONSOLE_HANDLER=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_TIMESLICING=n
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_MULTITHREADING=n
CONFIG_TICKLESS_KERNEL=n
CONFIG_TIMEOUT_64BIT=n
CONFIG_NRF_ENABLE_ICACHE=n
CONFIG_SIZE_OPTIMIZATIONS=y

# Activate LTO
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
