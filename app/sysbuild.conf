# Disable partition manager — the flash layout comes from
# devicetree (nrf52840_partitions.dtsi + the ext-flash FOTA
# layout), exactly as in Chapters 5–8.
SB_CONFIG_PARTITION_MANAGER=n

# Chapter 9's whole subject: add MCUboot as the bootloader
# image. Sysbuild builds it as a second image, places this app
# in slot 0, and signs the app image (the build proves it: a
# zephyr.signed.bin appears next to zephyr.bin, and NCS packs
# a dfu_application.zip). The bootloader's own configuration
# lives in sysbuild/mcuboot/.
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Chapter 10: build the DFU multi-image package. The add-on's
# sysbuild hook wraps that package (dfu_multi_image.bin) in
# the Zigbee OTA header to produce the .zigbee file — but only
# if the package build is enabled HERE, at sysbuild level.
# CONFIG_ZIGBEE_FOTA's own "imply DFU_MULTI_IMAGE_PACKAGE_BUILD"
# names an app-level symbol that does not exist; the imply
# silently does nothing, the build stays green, and the only
# evidence is the add-on's warning "No Zigbee FOTA image
# format selected" and a missing .zigbee file. (Fix F6 in the
# course build log; the nrf dfu_multi_image sample's
# sysbuild.conf is the proven pattern.)
SB_CONFIG_DFU_MULTI_IMAGE_PACKAGE_BUILD=y
SB_CONFIG_DFU_MULTI_IMAGE_PACKAGE_APP=y
