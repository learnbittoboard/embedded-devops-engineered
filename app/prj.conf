#
# Chapter 8, Step 2 — binding & actuation.
# Configuration is Step 1's, plus one product knob that lives in
# this app's Kconfig (see Kconfig): OCCUPANCY_OFF_DELAY_SEC, the
# no-presence hold time before the bulb is switched off. It takes
# its default (30 s) from Kconfig; a build overrides it here:
#     CONFIG_OCCUPANCY_OFF_DELAY_SEC=120
#

CONFIG_NCS_SAMPLES_DEFAULTS=y

# Serial console (the DK's USB UART) for logs.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_THREAD_PRIORITY=7

# The Zigbee R23 add-on itself, the application utilities, and
# this device's role: ROUTER.
CONFIG_ZIGBEE_ADD_ON=y
CONFIG_ZIGBEE_APP_UTILS=y
CONFIG_ZIGBEE_ROLE_ROUTER=y

# Enable DK LED and Buttons library
CONFIG_DK_LIBRARY=y

# This example requires more workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Chapter 4's driver, riding along ------------------------------
# The LD2410 receive path: interrupt-driven UART into a ring
# buffer, parser thread behind it (src/ld2410.c, unchanged).
CONFIG_RING_BUFFER=y

# The driver's own log module stays at INF: startup and resync
# warnings only. (The symbol exists because this app's Kconfig
# instantiates the log template for the LD2410 module name.)
CONFIG_LD2410_LOG_LEVEL_INF=y

# The `presence` shell command (src/main.c): live reading, driver
# counters, and the attribute the network can read.
CONFIG_SHELL=y

# --- Chapter 9: the signed image and the cable-DFU door ------------
#
# The version the BOOTLOADER AND THE OTA WORLD see. imgtool
# stamps it into the signed image header; it is deliberately a
# separate knob from the VERSION file (which feeds the app's
# own APP_VERSION_STRING log line) — the two must agree, and
# this chapter's lesson is about what breaks when they don't.
# Chapter 10 reuses this exact value as the Zigbee OTA file
# version.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.3.0"

# --- Chapter 10, Step 2: version policy, made explicit ---------------
#
# The OTA file version a server compares is composed from the
# imgtool stamp above (four BCD bytes: 1.3.0 -> 0x01030000).
# Policy in this course is enforced at three separate gates,
# and this build sets the one that lives on the CLIENT:
#
# The hardware-version window. The FOTA library can refuse
# images whose declared HW version falls outside
# [MIN, MAX]; the floor here is this product's hardware
# revision (52, the same value CONFIG_ZIGBEE_FOTA_HW_VERSION
# advertises), the ceiling is "no limit yet". An image built
# for older hardware is refused by the client itself, before
# a single block is stored. (The other two gates — the
# server only offering newer file versions, and MCUboot's
# signature check — are covered in this step's README.)
#
# BOTH bounds are set for a packaging reason this step's
# first build exposed: zb_add_ota_header.py writes the
# HW-version fields into the .zigbee header only as a PAIR
# (its source checks both values are present). Floor-only
# left the header's field control at 0 — the client gate was
# configured, but the package advertised nothing. With both
# set, the header grows by 4 bytes and the window travels
# with the file. (Build-log fix F7.)
CONFIG_ENABLE_ZIGBEE_FOTA_MIN_HW_VERSION=y
CONFIG_ZIGBEE_FOTA_MIN_HW_VERSION=0x34
CONFIG_ENABLE_ZIGBEE_FOTA_MAX_HW_VERSION=y
CONFIG_ZIGBEE_FOTA_MAX_HW_VERSION=0xFF

# CANARY for the over-the-air desk check: the occupancy OFF
# delay drops from 30 s to 10 s. If, after the OTA update,
# the bulb obeys 10 s instead of 30 s, the new image is not
# just booted — it is BEHAVING differently, which is the
# only update proof that matters. (Chapter 8's knob; the
# override lives here so the change is one visible line.)
CONFIG_OCCUPANCY_OFF_DELAY_SEC=10

# --- Chapter 10: the Zigbee OTA client ------------------------------
#
# The add-on's FOTA library (subsys/lib/zigbee_fota) puts an
# OTA Upgrade CLIENT cluster on its own endpoint and streams
# the image into the secondary slot through the DFU target —
# the same slot 1, the same signed bytes, the same MCUboot
# trial-and-confirm contract as Chapter 9's cable path. Only
# the transport is new.
#
# CONFIG_ZIGBEE_FOTA pulls in the bootloader chain with it
# (BOOTLOADER_MCUBOOT, MCUMGR, DFU_TARGET — verify in
# .config, never trust prj.conf).
CONFIG_ZIGBEE_FOTA=y
# The OTA endpoint must NOT be the product's endpoint 10 —
# the library's default (10) collides, so the FOTA endpoint
# moves to 5, exactly as the add-on's light_switch FOTA
# configuration does.
CONFIG_ZIGBEE_FOTA_ENDPOINT=5
# Hardware version the OTA header advertises. Nordic's
# samples use 52 for the nRF52840 family; the server matches
# on this (plus manufacturer and image type) before offering
# an image.
CONFIG_ZIGBEE_FOTA_HW_VERSION=52
# The comment lands in the .zigbee file's header — the string
# a human sees when inspecting the package.
CONFIG_ZIGBEE_FOTA_COMMENT="occupancy"
# Write the downloaded image through the MCUboot DFU target
# (slot 1), not to a file or a BLE target.
CONFIG_DFU_TARGET_MCUBOOT=y
# Emit progress events so the app can log the download
# percentage while it keeps sensing and switching.
CONFIG_ZIGBEE_FOTA_PROGRESS_EVT=y
# Deliberately NOT enabled: CONFIG_ZIGBEE_FOTA_DOWNLOAD_RESUME.
# Resume lets an interrupted download continue where it
# stopped (the add-on's samples enable it); this step keeps
# the surface minimal so the plain block flow is what you
# learn. Step 2's lesson section prices the trade-off.

# The cable update path: an mcumgr SMP server on the console
# UART (the board overlay points zephyr,uart-mcumgr at uart0).
# Steps 2–3 of this chapter push signed images through it with
# the mcumgr CLI (image upload / test / list). A shipping
# product would gate this door or compile it out — Chapter 9's
# lesson says so out loud; the lab keeps it because it is also
# the window that lets you WATCH the slot states (test,
# pending, confirmed) while rollback happens.
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
# mcumgr's own dependencies are NOT selected by anything in the
# Zigbee configuration — assign them or Kconfig silently drops
# the whole subsystem (it did exactly that on this step's first
# build; the warning is in the log and the absence is in the
# built .config — check .config, not prj.conf, Chapter 2's
# rule). NET_BUF + ZCBOR are mcumgr's deps; BASE64 + CRC +
# UART_MCUMGR are the UART transport's.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_UART_MCUMGR=y

# The image manager is how mcumgr writes the secondary slot —
# which lives in the DK's external QSPI flash, so the app
# needs the QSPI NOR driver too (the bootloader has its own
# copy, configured under sysbuild/mcuboot/).
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_NORDIC_QSPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_IMG_ERASE_PROGRESSIVELY=y
