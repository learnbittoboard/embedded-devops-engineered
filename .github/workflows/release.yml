# Release on tag — Chapter 11's mirror of Chapter 9.
#
# Same trigger (an annotated v* tag), same rule (the bits that
# were tested are the bits that ship): this workflow does not
# rebuild anything. It waits for the build workflow of the same
# commit to go green, downloads ITS artifacts, assembles the same
# bundle tools/make-release.sh makes, and publishes a GitHub
# Release with the same generator Chapter 9 uses.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # creating the Release — the only write in the course
  packages: read
  actions: read     # fetching the build run's artifacts

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download this commit's build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: occupancy-*
          merge-multiple: true
          path: build-assets

      - name: Assemble the bundle
        run: |
          mkdir -p build/app/zephyr release
          cp build-assets/zephyr.signed.bin build-assets/zephyr.signed.hex \
             build-assets/zephyr.elf build/app/zephyr/
          cp build-assets/dfu_application.zip build/
          cp build-assets/*.zigbee build/
          cp build-assets/manifest.json build/
          tools/make-release.sh build release

      - name: Publish the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish-release.sh release
