# The pipeline, ported — Chapter 11.
#
# The same factory as the Jenkinsfile, re-expressed: jobs are
# stages, steps are steps, `needs` is stage order. Same toolchain
# image (pulled from GHCR), same gates, same tests, same version
# rule, same manifest. Chapter 11 walks the two files side by side
# and keeps score honestly.
#
# The release is a JOB IN THIS WORKFLOW, not a second workflow:
# it declares `needs: build`, so it runs only after the build of
# THIS commit, in THIS run, has gone green — and the artifacts it
# publishes are the ones that same run uploaded, downloaded with
# no cross-run lookup at all. (The course's first draft had a
# separate release workflow downloading "the build's" artifacts
# by pattern: actions/download-artifact in a fresh run sees only
# that run's own artifacts, so the bundle could never have been
# assembled. One workflow, dependent jobs, is the fix — and the
# chapter now tells that story, because it is the instructive one.)
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/${{ github.repository_owner }}/toolchain:1.0.0-ncs3.4.1
      # The image's own default user is `builder` (Chapter 3's
      # local bind-mount ownership fix). The hosted runner's
      # workspace and cache mounts are root-owned, so a
      # container job must run as root or its first steps
      # (checkout, cache restore, the /ws symlink) cannot
      # write anywhere. Local use keeps `builder`; the port
      # to Actions is where the override belongs.
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # stamp-version.sh needs tags + history

      # The one structural difference from Jenkins: there is no
      # permanent Jenkins machine with a workspace mounted. The
      # workspace is created here and CACHED between runs, keyed
      # on the pinned stack version — a cache miss costs a full
      # west update (~15 min), a hit costs seconds. Chapter 11
      # does this math out loud.
      - name: Cache the NCS workspace
        uses: actions/cache@v4
        with:
          path: /github/ws-cache
          key: ncs-v3.4.1-${{ runner.os }}

      - name: Prepare workspace
        run: |
          if [ ! -d /github/ws-cache/nrf ]; then
            mkdir -p /github/ws-cache
            cd /github/ws-cache
            west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.4.1
            west update
            git clone --depth 1 --branch v1.4.0 \
              https://github.com/nrfconnect/sdk-zigbee /tmp/zigbee
            cp -r /tmp/zigbee /github/ws-cache/ncs-zigbee
          fi
          ln -sfn /github/ws-cache /ws

      - name: Version (the tag is the truth)
        id: version
        run: |
          tools/stamp-version.sh > .version
          echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"

      - name: Gates
        run: |
          clang-format --dry-run --Werror \
            app/src/*.c app/src/*.h app/tests/ld2410_parser/src/*.c
          cppcheck --enable=warning,performance,portability \
            --error-exitcode=1 --suppress=missingIncludeSystem \
            --inline-suppr app/src/ld2410_parser.c

      - name: Unit tests (Twister)
        run: |
          cd /ws
          west twister -T "$GITHUB_WORKSPACE/app/tests" \
            -p native_sim/native/64 \
            --outdir "$GITHUB_WORKSPACE/twister-out"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twister-results
          path: twister-out/twister.xml

      # Pull requests get a build of their own — unsigned. The
      # product signing key is a release asset, not a CI
      # convenience: no step that runs for a pull request (a fork's
      # pull request above all) may touch it. A PR build answers
      # "does it compile and pass the gates?"; signing answers
      # "is this fit to ship?", and only the pipeline's own pushes
      # and tags get to ask it.
      - name: Build (pull request — unsigned)
        if: github.event_name == 'pull_request'
        run: |
          cd /ws
          west build -p always -b nrf52840dk/nrf52840 \
            -d "$GITHUB_WORKSPACE/build" --sysbuild "$GITHUB_WORKSPACE/app" \
            -- -DZEPHYR_EXTRA_MODULES=/ws/ncs-zigbee

      - name: Build & sign
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_PEM: ${{ secrets.MCU_PRODUCT_KEY }}
        run: |
          # Same custody rule as Chapter 8: the private key exists
          # only as a secret, lands on disk only for this step,
          # and never enters the log (GitHub masks secret values).
          # The cleanup is a trap registered BEFORE the build:
          # GitHub runs step scripts with bash -e, so a failed
          # build exits immediately — a plain `rm` after the build
          # would never run, and on a self-hosted runner the key
          # would still be sitting in $RUNNER_TEMP afterwards.
          # The EXIT trap fires on every way out of the step:
          # success, build failure, or interruption.
          umask 077
          printf '%s' "$SIGNING_KEY_PEM" > "$RUNNER_TEMP/product-key.pem"
          trap 'rm -f "$RUNNER_TEMP/product-key.pem"' EXIT
          cd /ws
          west build -p always -b nrf52840dk/nrf52840 \
            -d "$GITHUB_WORKSPACE/build" --sysbuild "$GITHUB_WORKSPACE/app" \
            -- -DZEPHYR_EXTRA_MODULES=/ws/ncs-zigbee \
               -DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE=\"$RUNNER_TEMP/product-key.pem\"
          rm -f "$RUNNER_TEMP/product-key.pem"

      - name: Verify signatures
        if: github.event_name != 'pull_request'
        run: |
          python3 /ws/bootloader/mcuboot/scripts/imgtool.py verify \
            -k keys/product-key.pub.pem \
            build/app/zephyr/zephyr.signed.bin

      - name: Manifest & artifacts
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/make-manifest.py \
            --version "${{ steps.version.outputs.version }}" \
            --board nrf52840dk/nrf52840 \
            --toolchain-image "ghcr.io/${{ github.repository_owner }}/toolchain:1.0.0-ncs3.4.1" \
            --out build/manifest.json \
            build/app/zephyr/zephyr.signed.bin \
            build/app/zephyr/zephyr.signed.hex \
            build/app/zephyr/zephyr.elf \
            build/dfu_application.zip \
            build/*.zigbee

      - name: Upload artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Chapter 7's naming rule, unchanged: product, version,
          # commit — a name that answers "what exactly is this?"
          name: occupancy-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/app/zephyr/zephyr.signed.bin
            build/app/zephyr/zephyr.signed.hex
            build/app/zephyr/zephyr.elf
            build/dfu_application.zip
            build/*.zigbee
            build/manifest.json
          retention-days: 90

  # Release on tag — Chapter 11's mirror of Chapter 9, as a
  # dependent job of the build above. `needs: build` is the whole
  # mechanism: this job starts only when the build job of the
  # same run has succeeded, and is skipped — not failed late, not
  # run on stale artifacts — when it has not. The job-level `if`
  # confines it to tag pushes, and the publish step repeats the
  # tag check on its own, so no edit to the job condition alone
  # can turn a branch push into a published Release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # creating the Release — the only write in the course
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download this run's build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: occupancy-*
          merge-multiple: true
          path: build-assets

      - name: Assemble the bundle
        run: |
          mkdir -p build/app/zephyr release
          cp build-assets/zephyr.signed.bin build-assets/zephyr.signed.hex \
             build-assets/zephyr.elf build/app/zephyr/
          cp build-assets/dfu_application.zip build/
          cp build-assets/*.zigbee build/
          cp build-assets/manifest.json build/
          tools/make-release.sh build release

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/publish-release.sh release
